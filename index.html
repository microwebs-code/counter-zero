<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitio Cerrado</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .contenedor {
            background-color: #ffffff;
            padding: 50px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
        }
        .icono {
            font-size: 80px;
            margin-bottom: 20px;
            display: block;
        }
        h1 {
            color: #d9534f;
            font-size: 45px;
            margin: 0 0 15px 0;
            font-weight: 700;
        }
        p {
            font-size: 18px;
            color: #666;
            line-height: 1.6;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <span class="icono">🔒</span>
        <h1>CERRADO</h1>
        <p>Lo sentimos, en este momento el sitio no se encuentra disponible. Por favor, regresa más tarde o contáctanos si tienes alguna urgencia.</p>
    </div>

</body>
</html>
